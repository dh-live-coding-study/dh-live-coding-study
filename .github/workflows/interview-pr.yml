name: Interview in PR comments
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Study PR number
        required: true
        type: number
  workflow_call:
    inputs:
      pr:
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  issues: write
jobs:
  authorize:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.user.type != 'Bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - id: authorize
        run: node scripts/authorize-interview.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INTERVIEW_PR: ${{ inputs.pr || github.event.issue.number }}
  interview:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    concurrency:
      group: interview-${{ inputs.pr || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: interview-llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/interview-pr.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INTERVIEW_PR: ${{ inputs.pr || github.event.issue.number }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
