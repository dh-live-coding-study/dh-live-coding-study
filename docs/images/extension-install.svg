<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
  <title id="title">Chrome에 수집 확장 등록하기</title>
  <desc id="desc">설치 화면 안내도. chrome://extensions에서 개발자 모드를 켜고 Load unpacked를 누른 뒤 압축을 푼 저장소 안의 extension 폴더를 선택한다. 선택한 폴더 안에는 manifest.json이 있어야 한다.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; fill: #172b45; }
      .label { font-size: 20px; font-weight: 600; }
      .body { font-size: 18px; }
      .muted { fill: #52647b; font-size: 17px; }
      .code { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: 19px; }
      .number { fill: #fff; font-size: 19px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="610" rx="16" fill="#f3f6fb"/>
  <text x="32" y="43" font-size="26" font-weight="700">Chrome에 수집 확장 등록하기</text>
  <text x="928" y="42" class="muted" text-anchor="end">설치 화면 안내도</text>
  <rect x="32" y="68" width="896" height="244" rx="12" fill="#fff" stroke="#c5d0de"/>
  <rect x="52" y="86" width="856" height="40" rx="20" fill="#eef2f7"/>
  <text x="73" y="112" class="code">chrome://extensions</text>
  <text x="56" y="169" class="label">확장 프로그램</text>
  <rect x="628" y="139" width="278" height="50" rx="9" fill="#eef5ff" stroke="#2665bc" stroke-width="2"/>
  <circle cx="652" cy="164" r="15" fill="#2665bc"/><text x="652" y="171" class="number">1</text>
  <text x="680" y="171" class="body">개발자 모드</text>
  <rect x="838" y="153" width="44" height="23" rx="12" fill="#2665bc"/><circle cx="870" cy="164.5" r="9" fill="#fff"/>
  <rect x="56" y="207" width="440" height="50" rx="8" fill="#eef5ff" stroke="#2665bc" stroke-width="2"/>
  <circle cx="82" cy="232" r="15" fill="#2665bc"/><text x="82" y="239" class="number">2</text>
  <text x="109" y="239" class="body">압축해제된 확장 프로그램을 로드합니다</text>
  <text x="57" y="287" class="muted">영문 Chrome에서는 “Load unpacked” 버튼입니다.</text>
  <path d="M 276 312 V 336 H 140 V 355" fill="none" stroke="#2665bc" stroke-width="2"/>
  <path d="m 134 348 6 8 6 -8" fill="none" stroke="#2665bc" stroke-width="2"/>
  <rect x="32" y="358" width="896" height="216" rx="12" fill="#fff" stroke="#c5d0de"/>
  <circle cx="64" cy="392" r="15" fill="#2665bc"/><text x="64" y="399" class="number">3</text>
  <text x="92" y="399" class="label">manifest.json이 있는 extension 폴더 선택</text>
  <text x="63" y="441" class="code">dh-live-coding-study-main/</text>
  <path d="M 72 453 V 533 M 72 475 H 100 M 72 522 H 100" stroke="#a2b2c6" stroke-width="2" fill="none"/>
  <rect x="103" y="452" width="263" height="42" rx="7" fill="#e9f5ee" stroke="#27834c"/>
  <text x="120" y="480" class="code" style="fill:#195d36;font-weight:700">extension/</text>
  <text x="121" y="532" class="muted">README.md, docs/, …</text>
  <text x="399" y="480" class="body">이 폴더 안에 manifest.json이 있습니다.</text>
  <text x="399" y="513" class="muted">ZIP 파일이나 저장소 전체 폴더를 고르지 마세요.</text>
  <text x="399" y="546" class="muted">설치한 extension 폴더는 그대로 보관합니다.</text>
</svg>
